name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain and deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake pkg-config liburing-dev libssl-dev

      - name: Configure
        env:
          CC: gcc
          CXX: g++
        run: cmake -S . -B build -G Ninja -DCMAKE_CXX_SCAN_FOR_MODULES=ON -DCMAKE_CXX_FLAGS='-Wall -Wextra -Wpedantic -Wconversion -Wshadow -Werror -Wno-attributes'

      - name: Build
        env:
          CC: gcc
          CXX: g++
        run: cmake --build build --parallel 1

      - name: Test
        env:
          CC: gcc
          CXX: g++
        run: ctest --test-dir build --output-on-failure
