name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain and deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake pkg-config liburing-dev libssl-dev g++-14

      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        run: cmake -S . -B build -G Ninja -DCMAKE_CXX_SCAN_FOR_MODULES=ON

      - name: Build
        env:
          CC: gcc-14
          CXX: g++-14
        run: cmake --build build

      - name: Test
        env:
          CC: gcc-14
          CXX: g++-14
        run: ctest --test-dir build --output-on-failure
